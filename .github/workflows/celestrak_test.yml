name: CelesTrak Fetch Test

on:
  workflow_dispatch: {}

jobs:
  fetch-single-object:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch a single object from CelesTrak
        run: python src/fetch_tles.py --catnr 25544

      - name: Print fetched TLE file
        run: cat data/live_tles_*.txt
