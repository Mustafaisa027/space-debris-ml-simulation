name: Collect TLE observations

on:
  schedule:
    # Twelve attempts per three-hour scientific slot tolerate delayed/dropped
    # GitHub cron delivery (best-effort scheduling can skip whole windows under
    # load). The archive-backed slot guard still permits at most one actual
    # poll per slot, so extra triggers are cheap no-ops and do not change slot
    # assignment or sample weighting. Redundancy widened mid-collection on
    # 2026-07-28 after GitHub dropped several scheduled windows.
    - cron: "7 * * * *"
    - cron: "17 * * * *"
    - cron: "37 * * * *"
    - cron: "47 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: tle-observation-collector
  cancel-in-progress: false

jobs:
  collect-and-publish:
    # Scheduled runs always use the default branch; manual authoritative runs
    # are restricted to main so a feature ref cannot publish experiment data.
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COLLECTION_ROOT: staging/collection
      DATA_BRANCH: data-collection
      EXPERIMENT_CONFIG: config/experiment_15_days_v5.json
      ARCHIVE_COLLECTIONS: experiments/iac26-15d-v5/collections
      SPACETRACK_IDENTITY: ${{ secrets.SPACETRACK_IDENTITY }}
      SPACETRACK_PASSWORD: ${{ secrets.SPACETRACK_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out the immutable data archive
        uses: actions/checkout@v4
        with:
          ref: data-collection
          path: archive-check

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-collector.txt

      - name: Check frozen collection slot
        id: collection_slot
        run: python src/collection_slot_guard.py archive-check --config "$EXPERIMENT_CONFIG"

      - name: Install collector dependencies
        if: steps.collection_slot.outputs.collect == 'true'
        run: python -m pip install -r requirements-collector.txt

      - name: Collect one observation bundle
        if: steps.collection_slot.outputs.collect == 'true'
        run: |
          python src/collect_observations.py \
            --once \
            --config "$EXPERIMENT_CONFIG" \
            --provider auto \
            --snapshot-dir "$COLLECTION_ROOT/tle" \
            --run-root "$COLLECTION_ROOT/runs" \
            --history "$COLLECTION_ROOT/history/conjunction_observations_iac26_75_v5.csv"

      - name: Verify collection output
        if: steps.collection_slot.outputs.collect == 'true'
        run: |
          test -s "$COLLECTION_ROOT/history/conjunction_observations_iac26_75_v5.csv"
          test "$(find "$COLLECTION_ROOT/tle" -type f -name '*.txt' | wc -l)" -ge 1
          test "$(find "$COLLECTION_ROOT/runs" -type f -name 'conjunction_dataset.csv' | wc -l)" -ge 1

      - name: Record runtime environment
        if: steps.collection_slot.outputs.collect == 'true'
        run: python src/capture_runtime_environment.py "$COLLECTION_ROOT/environment/runtime.json"

      - name: Embed frozen experiment config
        if: steps.collection_slot.outputs.collect == 'true'
        run: |
          mkdir -p "$COLLECTION_ROOT/experiment"
          cp "$EXPERIMENT_CONFIG" "$COLLECTION_ROOT/experiment/config.json"

      - name: Build integrity manifest
        if: steps.collection_slot.outputs.collect == 'true'
        run: |
          python src/build_collection_manifest.py "$COLLECTION_ROOT" \
            --experiment-config "$EXPERIMENT_CONFIG"

      - name: Publish bundle to the data branch
        if: steps.collection_slot.outputs.collect == 'true'
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin "$DATA_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$DATA_BRANCH"
            git worktree add --detach data-store "origin/$DATA_BRANCH"
          else
            git worktree add --detach data-store HEAD
            cd data-store
            git switch --orphan "$DATA_BRANCH"
            git rm -rf --ignore-unmatch .
            printf '%s\n' '# Space Debris Observation Archive' \
              '' 'Generated automatically by GitHub Actions. See the main branch for source code.' > README.md
            cd ..
          fi

          printf '%s\n' 'collections/** -text' 'experiments/** -text' > data-store/.gitattributes
          destination="data-store/${ARCHIVE_COLLECTIONS}/github-run-${RUN_ID}-attempt-${RUN_ATTEMPT}"
          if [ -e "$destination" ]; then
            echo "Refusing to overwrite immutable collection destination: $destination" >&2
            exit 1
          fi
          mkdir -p "$(dirname "$destination")"
          mkdir "$destination"
          cp -R "$COLLECTION_ROOT"/. "$destination"/

          cd data-store
          git add "$ARCHIVE_COLLECTIONS" README.md .gitattributes
          if git diff --cached --quiet; then
            echo "No new collection data to publish."
            exit 0
          fi
          git commit -m "data: add observation run ${RUN_ID} attempt ${RUN_ATTEMPT}"
          git push origin HEAD:"$DATA_BRANCH"
